<div
  class="switcher"
  role="group"
  i18n-aria-label="Purpose of the language control|@@languageSwitcher.group"
  aria-label="Idioma"
>
  @for (option of options(); track option.code) {
    <a
      class="switcher__option"
      [class.is-active]="option.active"
      [href]="option.href"
      [attr.hreflang]="option.code"
      [attr.title]="option.name"
      [attr.aria-current]="option.active ? 'true' : null"
      (click)="persist(option.code)"
      >{{ option.label }}</a
    >
  }
</div>
