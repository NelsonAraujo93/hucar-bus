@if (posts().length > 0) {
  <section class="instagram" id="instagram">
    <div class="instagram__inner">
      <hb-section-header
        [eyebrow]="handle()"
        i18n-title="Section heading|@@instagram.title"
        title="Síguenos en Instagram"
        i18n-subtitle="Section supporting line|@@instagram.subtitle"
        subtitle="Las mejores vistas de Lanzarote, desde la ventanilla."
        [dark]="true"
      />

      <ul class="grid">
        @for (post of posts(); track post.id) {
          <li class="tile">
            <a class="tile__link" [href]="post.permalink" target="_blank" rel="noopener noreferrer">
              <!-- Copied into this site at build time, so the browser never
                   contacts Meta. Below the fold, so NgOptimizedImage lazy-loads it. -->
              <picture>
                <source type="image/webp" [srcset]="post.image.webp" />
                <img
                  class="tile__image"
                  [ngSrc]="post.image.jpg"
                  [width]="post.image.width"
                  [height]="post.image.height"
                  [alt]="post.caption || genericAlt"
                />
              </picture>
              <!-- No like count: it would go stale between builds. The caption
                   is the owner's own, from Instagram. -->
              <span class="tile__overlay" aria-hidden="true">
                <hb-icon name="instagram" [size]="28" color="#fff" />
                @if (post.caption; as caption) {
                  <span class="tile__caption">{{ caption }}</span>
                }
              </span>
            </a>
          </li>
        }
      </ul>

      <p class="instagram__cta">
        <a hb-button variant="teal" [href]="config.instagramUrl">
          <hb-icon hb-button-icon name="instagram" [size]="18" color="#fff" />
          <span i18n="Instagram call to action|@@instagram.cta">Seguir en Instagram →</span>
        </a>
      </p>
    </div>
  </section>
}
