<section class="contact" id="contacto">
  <div class="contact__inner">
    <hb-section-header
      i18n-eyebrow="Section eyebrow|@@contact.eyebrow"
      eyebrow="Contacto"
      i18n-title="Section heading|@@contact.title"
      title="Contáctanos"
      i18n-subtitle="Section supporting line|@@contact.subtitle"
      subtitle="Escríbenos y te respondemos en menos de 24 horas — normalmente en minutos."
    />

    <div class="contact__grid">
      <div class="contact__card">
        <hb-contact-form />
      </div>

      <div class="contact__info">
        <ul class="rows">
          <li class="row">
            <span class="row__icon" aria-hidden="true"
              ><hb-icon name="phone" [size]="20" color="#2BBCD4"
            /></span>
            <span class="row__text">
              <span class="row__label" i18n="Contact detail label|@@contact.rows.phone"
                >Teléfono</span
              >
              <a class="row__value" [href]="config.phoneHref">{{ config.phone }}</a>
            </span>
          </li>
          <li class="row">
            <span class="row__icon" aria-hidden="true"
              ><hb-icon name="mail" [size]="20" color="#2BBCD4"
            /></span>
            <span class="row__text">
              <span class="row__label" i18n="Contact detail label|@@contact.rows.email">Email</span>
              <a class="row__value" [href]="'mailto:' + config.email">{{ config.email }}</a>
            </span>
          </li>
          <li class="row">
            <span class="row__icon" aria-hidden="true"
              ><hb-icon name="pin" [size]="20" color="#2BBCD4"
            /></span>
            <span class="row__text">
              <span class="row__label" i18n="Contact detail label|@@contact.rows.base">Base</span>
              <span class="row__value">{{ config.addressFull }}</span>
            </span>
          </li>
          <li class="row">
            <span class="row__icon" aria-hidden="true"
              ><hb-icon name="clock" [size]="20" color="#2BBCD4"
            /></span>
            <span class="row__text">
              <span class="row__label" i18n="Contact detail label|@@contact.rows.hours"
                >Horario</span
              >
              <span class="row__value" i18n="Opening hours|@@contact.hours.value"
                >Lun–Dom · 24/7 disponibilidad</span
              >
            </span>
          </li>
        </ul>

        <a hb-button variant="whatsapp" size="lg" [full]="true" [href]="config.whatsappUrl">
          <hb-icon hb-button-icon name="whatsapp" [size]="20" />
          <span i18n="WhatsApp call to action|@@contact.whatsapp">Escríbenos por WhatsApp</span>
        </a>

        <!-- Awaiting a real embedded map centred on Arrecife. -->
        <hb-image-placeholder class="contact__map" tone="ocean" />
      </div>
    </div>
  </div>
</section>
