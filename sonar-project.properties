# Replace both values with the keys shown in SonarQube Cloud after importing the repo.
sonar.projectKey=NelsonAraujo93_hucar-bus
sonar.organization=nelsonaraujo93

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Bootstrap, config and generated files carry no logic worth measuring.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  src/main.ts,\
  src/main.server.ts,\
  src/server.ts,\
  src/**/*.spec.ts

sonar.coverage.exclusions=\
  src/main.ts,\
  src/main.server.ts,\
  src/server.ts,\
  src/app/app.config.ts,\
  src/app/app.config.server.ts,\
  src/app/app.routes.ts,\
  src/app/app.routes.server.ts,\
  src/**/*.spec.ts

# Path is written by the unit-test builder's lcov reporter.
# Verify against the first CI run and adjust if the builder emits elsewhere.
sonar.javascript.lcov.reportPaths=coverage/hucar-bus/lcov.info

sonar.sourceEncoding=UTF-8
